set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-logging'

# set -g @plugin 'egel/tmux-gruvbox'

# set -g @tmux-gruvbox 'dark'

set -g @plugin 'arcticicestudio/nord-tmux'

run '~/.tmux/plugins/tpm/tpm'

set -g allow-passthrough on
set -g mouse on

# --- background-window alerts ---
set -g monitor-activity on
set -g monitor-bell on
setw -g monitor-silence 5
# nord hardcodes inline tab colors, so tmux's default `reverse` alert style renders
# as a plain white block; drop it and render the flags ourselves below
setw -g window-status-activity-style default
setw -g window-status-bell-style default
# claude runs via `ollama launch claude` here, so match either process name
# flags: red ! = bell (waiting for input), yellow # = activity,
#        green ▶ = claude is foreground AND pane silent 5s (= stopped, waiting for input)
setw -g window-status-format "#[fg=black,bg=brightblack,nobold,noitalics,nounderscore] #[fg=white,bg=brightblack]#I #[fg=white,bg=brightblack,nobold,noitalics,nounderscore] #[fg=white,bg=brightblack]#W #[if=#{window_bell_flag},fg=#bf616a,bold,fg=white,bg=brightblack,nobold,noitalics,nounderscore]#{?#{window_bell_flag},! ,}#[if=#{window_activity_flag},fg=#ebcb8b,bold,fg=white,bg=brightblack,nobold,noitalics,nounderscore]#{?#{window_activity_flag},# ,}#{?#{window_last_flag},- ,}#{?#{window_zoomed_flag},Z ,}#[if=#{&&:#{||:#{==:#{pane_current_command},claude},#{==:#{pane_current_command},ollama}},#{window_silence_flag}},fg=#a3be8c,bold,fg=white,bg=brightblack,nobold,noitalics,nounderscore]#{?#{&&:#{||:#{==:#{pane_current_command},claude},#{==:#{pane_current_command},ollama}},#{window_silence_flag}},▶ ,}#[fg=brightblack,bg=black,nobold,noitalics,nounderscore]"
# active tab: drop nord's raw #F flags (the activity/silence noise you saw), keep zoom + claude ▶
setw -g window-status-current-format "#[fg=black,bg=cyan,nobold,noitalics,nounderscore] #[fg=black,bg=cyan]#I #[fg=black,bg=cyan,nobold,noitalics,nounderscore] #[fg=black,bg=cyan]#W #{?#{window_zoomed_flag},Z ,}#[if=#{&&:#{||:#{==:#{pane_current_command},claude},#{==:#{pane_current_command},ollama}},#{window_silence_flag}},fg=#2e3440,bg=#a3be8c,bold,fg=black,bg=cyan,nobold,noitalics,nounderscore]#{?#{&&:#{||:#{==:#{pane_current_command},claude},#{==:#{pane_current_command},ollama}},#{window_silence_flag}},▶ ,}#[fg=cyan,bg=black,nobold,noitalics,nounderscore]"

# --- kitty: tmux-256color (italics) + truecolor + system clipboard ---
set -s default-terminal "tmux-256color"
set -as terminal-features ',xterm-kitty:RGB'
set -g set-clipboard on
# set -s extended-keys on
# set -as terminal-features 'xterm*:extkeys'
